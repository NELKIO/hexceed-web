    <script>
      // apply the saved / system theme before the first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('hexlume:settings') || '{}');
        // dark by default; "light" when chosen; "auto" follows the system
        var th = s.theme === 'light' ? 'light' : s.theme === 'auto' && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = th;
        if (s.theme !== 'auto')
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.setAttribute('content', th === 'dark' ? '#0b0c0f' : '#f4f2ed');
          });
        else
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            if ((m.getAttribute('media') || '').indexOf('light') >= 0) m.setAttribute('content', '#f4f2ed');
          });
      } catch (e) {}
    </script>
